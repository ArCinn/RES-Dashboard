<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RES-Dashboard</title>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg: #eef4f7;
            --panel: #ffffff;
            --panel-soft: #f5f9fb;
            --line: #dfe9f0;
            --text: #24333d;
            --muted: #5f727d;
            --blue: #2f72d7;
            --red: #d73f3f;
            --green: #4caf50;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 28px 18px 42px;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #f5f8fa 0%, var(--bg) 100%);
            color: var(--text);
        }

        h1, h2, h3, h4 {
            margin: 0;
            color: var(--text);
        }

        h1 {
            text-align: center;
            font-size: clamp(2rem, 3vw, 2.6rem);
            margin-bottom: 18px;
            letter-spacing: -0.04em;
        }

        h2 {
            text-align: center;
            font-size: clamp(1.35rem, 2vw, 1.8rem);
            margin: 28px 0 16px;
            letter-spacing: -0.02em;
        }

        #controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 20px auto 28px;
            padding: 16px 18px;
            max-width: 820px;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(107, 132, 148, 0.18);
        }

        button {
            padding: 11px 18px;
            border: none;

            color: white;
            font-weight: 700;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
            box-shadow: 0 8px 18px rgba(47, 114, 215, 0.18);
        }

        button:hover {
            transform: translateY(-1px);
            opacity: 0.96;
        }

        button:active {
            transform: translateY(0);
        }

        #seed-btn { background: var(--blue); }
        #delete-btn { background: var(--red); }
        #refresh-btn { background: var(--green); }

        #secondary-graphs {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            max-width: 1200px;
            margin: 0 auto 16px;
            align-items: start;
        }

        #secondary-graphs .main-graph-card {
            height: 100%;
            min-height: 100px;
        }

        .secondary-graph-card {
            min-height: 100px;
        }

        #secondary-graphs .secondary-graph-card.centered {
            grid-column: 1 / -1;
            width: min(50%, 560px);
            justify-self: center;
            margin: 0 auto;
        }

        #firestore-error {
            display: none;
            max-width: 760px;
            margin: 0 auto 22px;
            padding: 14px 16px;

            background: #fdecea;
            color: #9f2f2d;
            border: 1px solid #f5c2c7;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 8px 18px rgba(159, 47, 45, 0.08);
        }

        .main-graph-card {
            background: var(--panel);
            padding: 10px 12px 8px;
            border: 1px solid var(--line);
            height: 500px;
            max-height: 700px;
            overflow: hidden;
        }

        .main-graph-card h3 {
            margin-bottom: 10px;
            font-size: 1.06rem;
            font-weight: 700;
            color: var(--text);
        }

        #secondary-graphs .main-graph-card {
            height: 360px;
            min-height: 360px;
            width: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .secondary-graph-card {
            overflow: hidden;
        }

        .secondary-graph-card canvas {
            flex: 1 1 auto;
            height: 260px !important;
            min-height: 260px;
        }

        .stats-panel {
            background: var(--panel-soft);
            padding: 5px;
            margin-top: 10px;

            text-align: center;
            font-weight: 700;
            font-size: 0.9em;
            color: var(--muted);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0px;
            margin: 0 auto 12px;
            max-width: 1320px;
        }

        .grid-card {
            background: var(--panel);
            padding: 6px 8px 4px;
            border: 1px solid var(--line);
            min-height: 210px;
            max-height: 300px;
            overflow: hidden;
        }

        .grid-card h4 {
            margin-bottom: 10px;
            font-size: 0.96rem;
            font-weight: 700;
            color: var(--text);
        }

        canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
            max-height: 450px;
        }
    </style>

    <h1>Research Dashboard</h1>

    <div id="controls" style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:20px 0;">
        <button id="seed-btn" style="padding:10px 18px;border:none;background:#2f72d7;color:white;cursor:pointer;">Start Device Seed</button>
        <button id="delete-btn" style="padding:10px 18px;border:none;background:#d73f3f;color:white;cursor:pointer;">Delete All Readings</button>
        <button id="refresh-btn" style="padding:10px 18px;border:none;background:#4caf50;color:white;cursor:pointer;">Refresh Dashboard</button>
    </div>

    <div id="firestore-error" style="display:none;max-width:700px;margin:0 auto 20px;padding:14px 16px;background:#fdecea;color:#a2271d;border:1px solid #f5c2c7;font-weight:600;text-align:center;"></div>

    <h2>The 3 Devices vs Control</h2>
    <div id="main-graphs" class="main-container"></div>

    <h2>Day Specific datapoints</h2>
    <div id="secondary-graphs"></div>

    <h2>Individual Device Readings</h2>
    <div id="tertiary-graphs"></div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collectionGroup, collection, query, getDocs, orderBy, addDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const FETCH_DATA = true; // Set to true only when you actually want live Firestore reads/writes.
        const deviceOrder = ['DeviceControl', 'DeviceHi', 'DeviceMed', 'DeviceLow'];
        const units = [
            { key: 'temperature', label: 'Temperature (*C)', unit: '°C' },
            { key: 'humidity', label: 'Relative Humidity (%)', unit: '%' },
            { key: 'pm', label: 'CO2 Concentration (ppm)', unit: 'ppm' }
        ];

        function generateDummyData() {
            const createdData = {};
            const startDate = new Date('2026-09-14T00:00:00+08:00');
            const basePatterns = {
                DeviceControl: { temp: 22, humidity: 48, pm: 520 },
                DeviceHi: { temp: 28, humidity: 42, pm: 840 },
                DeviceMed: { temp: 25, humidity: 53, pm: 680 },
                DeviceLow: { temp: 23, humidity: 58, pm: 450 }
            };

            deviceOrder.forEach((deviceId) => {
                const readings = [];
                const pattern = basePatterns[deviceId];

                for (let day = 0; day < 7; day++) {
                    for (let hour = 8; hour <= 20; hour += 2) {
                        const timestamp = new Date(startDate);
                        timestamp.setDate(startDate.getDate() + day);
                        timestamp.setHours(hour, (day * 7 + hour) % 60, 0, 0);

                        const tempShift = Math.sin((day + 1) * 1.2 + hour / 4) * 2.8;
                        const humidityShift = Math.cos((day + 1) * 0.9 + hour / 3) * 8;
                        const pmShift = Math.sin((day + 1) * 1.7 + hour / 2) * 110;

                        readings.push({
                            timestamp,
                            temperature: Number((pattern.temp + tempShift).toFixed(1)),
                            humidity: Number((pattern.humidity + humidityShift).toFixed(1)),
                            pm: Number((pattern.pm + pmShift).toFixed(0))
                        });
                    }
                }

                createdData[deviceId] = readings;
            });

            return createdData;
        }

        const DUMMY_DATA = generateDummyData();

        const firebaseConfig = {
            apiKey: "AIzaSyCOpg3gV-_gwAhvh2Blwr3awMPln7yG2ys",
            authDomain: "res-database-efcbe.firebaseapp.com",
            projectId: "res-database-efcbe",
            storageBucket: "res-database-efcbe.firebasestorage.app",
            messagingSenderId: "402511038798",
            appId: "1:402511038798:web:4697300d8224dae57b361f",
            measurementId: "G-JH4927MGX0"
        };

        const app = FETCH_DATA ? initializeApp(firebaseConfig) : null;
        const db = FETCH_DATA ? getFirestore(app) : null;
        const deviceColors = {
            DeviceControl: '#2f72d7',
            DeviceHi: '#d73f3f',
            DeviceMed: '#f39c12',
            DeviceLow: '#27ae60'
        };
        const controlDeviceId = 'DeviceControl';
        const secondaryMetricKeys = ['temperature', 'humidity', 'pm'];
        const dateRange = ['2026-09-14', '2026-09-15', '2026-09-16', '2026-09-17', '2026-09-18', '2026-09-19', '2026-09-20'];
        const SHOW_INFODOTS = false;

        function getMetricDisplayName(metricKey) {
            const metric = units.find(({ key }) => key === metricKey);
            return metric ? metric.label : metricKey.toUpperCase();
        }
        const dayAnchors = [
            { day: 1, date: new Date('2026-09-14T00:00:00') },
            { day: 2, date: new Date('2026-09-15T00:00:00') },
            { day: 3, date: new Date('2026-09-16T00:00:00') },
            { day: 4, date: new Date('2026-09-17T00:00:00') },
            { day: 5, date: new Date('2026-09-18T00:00:00') },
            { day: 6, date: new Date('2026-09-20T00:00:00') },
            { day: 7, date: new Date('2026-09-21T00:00:00') }
        ];
        let simulationInterval = null;

        function getRandomBetween(min, max) {
            return +(Math.random() * (max - min) + min).toFixed(1);
        }

        function getSingaporeDateParts(dateInput) {
            const formatter = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Asia/Singapore',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });

            const parts = formatter.formatToParts(new Date(dateInput));
            const lookup = {};
            parts.forEach(part => {
                if (part.type !== 'literal') lookup[part.type] = part.value;
            });

            return {
                year: Number(lookup.year),
                month: Number(lookup.month),
                day: Number(lookup.day)
            };
        }

        function normalizeToDateOnly(dateInput) {
            const { year, month, day } = getSingaporeDateParts(dateInput);
            return new Date(`${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}T00:00:00+08:00`);
        }

        function getDayNumber(dateInput) {
            const target = normalizeToDateOnly(dateInput);
            let closest = dayAnchors[0];
            let smallestDistance = Number.POSITIVE_INFINITY;

            for (const anchor of dayAnchors) {
                const distance = Math.abs(target.getTime() - anchor.date.getTime());
                if (distance < smallestDistance) {
                    smallestDistance = distance;
                    closest = anchor;
                }
            }

            return closest.day;
        }

        function formatDayLabel(dateInput) {
            return `Day ${getDayNumber(dateInput)}`;
        }

        function formatDateToDayLabel(dateInput) {
            const parsedDate = new Date(dateInput);
            if (Number.isNaN(parsedDate.getTime())) return 'Unknown Day';
            return formatDayLabel(parsedDate);
        }

        function normalizeReading(data) {
            const timestamp = data.timestamp && typeof data.timestamp.toDate === 'function'
                ? data.timestamp.toDate()
                : new Date(data.timestamp);

            return {
                ...data,
                timestamp,
                temperature: Number(data.temperature ?? 0),
                humidity: Number(data.humidity ?? 0),
                pm: Number(data.pm ?? data.co2 ?? 0)
            };
        }

        function getValueForMetric(reading, metricKey) {
            if (metricKey === 'pm') return Number(reading.pm ?? reading.co2 ?? 0);
            return Number(reading[metricKey] ?? 0);
        }

        function formatDateKey(date) {
            const { year, month, day } = getSingaporeDateParts(date);
            return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        }

        function formatDateLabel(date) {
            return new Intl.DateTimeFormat('en-US', {
                timeZone: 'Asia/Singapore',
                month: 'short',
                day: 'numeric'
            }).format(new Date(date));
        }

        function showFirestoreError(message) {
            const errorBox = document.getElementById('firestore-error');
            errorBox.textContent = message;
            errorBox.style.display = 'block';
        }

        function hideFirestoreError() {
            const errorBox = document.getElementById('firestore-error');
            errorBox.textContent = '';
            errorBox.style.display = 'none';
        }

        function getTimeBucket(date) {
            const d = new Date(date);
            const formatter = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Asia/Singapore',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });

            const parts = formatter.formatToParts(d);
            const lookup = {};
            parts.forEach(part => {
                if (part.type !== 'literal') lookup[part.type] = part.value;
            });

            return new Date(`${lookup.year}-${lookup.month}-${lookup.day}T${lookup.hour}:${lookup.minute}:00+08:00`);
        }

        function formatTimeLabel(date) {
            return new Intl.DateTimeFormat('en-SG', {
                timeZone: 'Asia/Singapore',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            }).format(new Date(date));
        }

        async function seedControlDeviceReading() {
            if (!FETCH_DATA) {
                alert('Firestore is disabled by FETCH_DATA. Set FETCH_DATA to true to seed live readings.');
                return;
            }

            const seededResults = [];
            const baseTimestamp = getTimeBucket(new Date());

            for (const deviceId of deviceOrder) {
                const readingsRef = collection(db, 'devices', deviceId, 'readings');
                const newReading = {
                    timestamp: new Date(baseTimestamp),
                    temperature: getRandomBetween(
                        deviceId === 'DeviceControl' ? 21 : deviceId === 'DeviceHi' ? 26 : deviceId === 'DeviceMed' ? 24 : 22,
                        deviceId === 'DeviceControl' ? 25 : deviceId === 'DeviceHi' ? 32 : deviceId === 'DeviceMed' ? 29 : 27
                    ),
                    humidity: getRandomBetween(
                        deviceId === 'DeviceControl' ? 40 : deviceId === 'DeviceHi' ? 35 : deviceId === 'DeviceMed' ? 45 : 50,
                        deviceId === 'DeviceControl' ? 55 : deviceId === 'DeviceHi' ? 48 : deviceId === 'DeviceMed' ? 60 : 65
                    ),
                    pm: getRandomBetween(
                        deviceId === 'DeviceControl' ? 400 : deviceId === 'DeviceHi' ? 680 : deviceId === 'DeviceMed' ? 520 : 350,
                        deviceId === 'DeviceControl' ? 700 : deviceId === 'DeviceHi' ? 980 : deviceId === 'DeviceMed' ? 760 : 580
                    )
                };

                try {
                    await addDoc(readingsRef, newReading);
                    seededResults.push(`${deviceId}: ${newReading.temperature}°C / ${newReading.humidity}% / ${newReading.pm} ppm`);
                    console.log(`Seeded ${deviceId} reading:`, newReading);
                } catch (error) {
                    console.error(`Failed to seed ${deviceId} reading:`, error);
                }
            }

            if (seededResults.length > 0) {
                console.log('Seeded devices:', seededResults);
                await buildDashboard();
            }
        }

        function toggleSimulation() {
            const button = document.getElementById('seed-btn');
            if (simulationInterval) {
                clearInterval(simulationInterval);
                simulationInterval = null;
                button.innerText = 'Start Device Seed (DONT PRESS DUM DUM)';
                return;
            }

            seedControlDeviceReading();
            simulationInterval = setInterval(seedControlDeviceReading, 10000);
            button.innerText = 'Stop Device Seed';
        }

        async function deleteAllReadings() {
            if (!FETCH_DATA) {
                alert('Firestore is disabled by FETCH_DATA. Set FETCH_DATA to true to delete live readings.');
                return;
            }

            if (!window.confirm('Delete all readings from Firestore? This cannot be undone.')) {
                return;
            }

            const readingsQuery = query(collectionGroup(db, 'readings'));
            const snapshot = await getDocs(readingsQuery);
            const docs = snapshot.docs;

            if (docs.length === 0) {
                alert('No readings found to delete.');
                return;
            }

            const batchSize = 500;
            for (let i = 0; i < docs.length; i += batchSize) {
                const batch = writeBatch(db);
                docs.slice(i, i + batchSize).forEach((docSnap) => {
                    batch.delete(docSnap.ref);
                });
                await batch.commit();
            }

            alert(`Deleted ${docs.length} readings.`);
            await buildDashboard();
        }

        function buildDatasetForMetric(data, deviceId, metricKey, labels) {
            const readings = data[deviceId] || [];
            const valueMap = new Map();
            readings.forEach(reading => {
                valueMap.set(formatDateKey(reading.timestamp) + '-' + formatTimeLabel(reading.timestamp), getValueForMetric(reading, metricKey));
            });

            return labels.map((label) => valueMap.get(label) ?? null);
        }

        async function buildDashboard() {
            console.log(FETCH_DATA ? 'Fetching live Firestore data...' : 'Using built-in dummy data...');
            hideFirestoreError();

            const mainContainer = document.getElementById('main-graphs');
            const secondaryContainer = document.getElementById('secondary-graphs');
            const tertiaryContainer = document.getElementById('tertiary-graphs');
            mainContainer.innerHTML = '';
            secondaryContainer.innerHTML = '';
            tertiaryContainer.innerHTML = '';

            try {
                let normalizedData = {};

                if (!FETCH_DATA) {
                    normalizedData = {};
                    deviceOrder.forEach(deviceId => {
                        normalizedData[deviceId] = (DUMMY_DATA[deviceId] || []).map(reading => ({
                            ...reading,
                            timestamp: new Date(reading.timestamp),
                            dateOnly: formatDateKey(reading.timestamp),
                            timeOnly: formatTimeLabel(reading.timestamp),
                            temperature: Number(reading.temperature),
                            humidity: Number(reading.humidity),
                            pm: Number(reading.pm)
                        })).sort((a, b) => a.timestamp - b.timestamp);
                    });
                } else {
                    const allReadings = query(collectionGroup(db, 'readings'), orderBy('timestamp', 'asc'));
                    const snapshot = await getDocs(allReadings);

                    const rawData = {};
                    snapshot.forEach(doc => {
                        const data = normalizeReading(doc.data());
                        const deviceId = doc.ref.path.split('/')[1];
                        if (!rawData[deviceId]) rawData[deviceId] = [];

                        if (data.timestamp && !isNaN(data.timestamp)) {
                            rawData[deviceId].push({
                                timestamp: data.timestamp,
                                dateOnly: formatDateKey(data.timestamp),
                                timeOnly: formatTimeLabel(data.timestamp),
                                temperature: data.temperature,
                                humidity: data.humidity,
                                pm: data.pm
                            });
                        }
                    });

                    deviceOrder.forEach(deviceId => {
                        normalizedData[deviceId] = (rawData[deviceId] || []).sort((a, b) => a.timestamp - b.timestamp);
                    });
                }

                buildMainGraphs(normalizedData);
                buildSecondaryGraphs(normalizedData);
                buildTertiaryGraphs(normalizedData);
            } catch (error) {
                console.error('Dashboard data load failed:', error);
                showFirestoreError('Unable to retrieve data from Firestore. Please check your internet connection, project access, and Firestore rules.');
                mainContainer.innerHTML = '';
                secondaryContainer.innerHTML = '';
                tertiaryContainer.innerHTML = '';
            }
        }

        function getAllTimestampLabels(data) {
            const allTimestamps = [];
            deviceOrder.forEach(deviceId => {
                (data[deviceId] || []).forEach(reading => {
                    if (reading.timestamp && !isNaN(reading.timestamp)) {
                        allTimestamps.push(getTimeBucket(reading.timestamp).getTime());
                    }
                });
            });
            return [...new Set(allTimestamps)].sort((a, b) => a - b).map((ts) => new Date(ts));
        }

        function buildMainGraphs(data) {
            const container = document.getElementById('main-graphs');
            const allTimes = getAllTimestampLabels(data);

            units.forEach(({ key, label }) => {
                const card = document.createElement('div');
                card.className = 'main-graph-card';
                card.innerHTML = `<h3>${label} Across All Devices</h3><canvas id="main-${key}"></canvas>`;
                container.appendChild(card);

                const datasets = deviceOrder.map(deviceId => {
                    const valueMap = new Map((data[deviceId] || []).map(reading => [getTimeBucket(reading.timestamp).getTime(), getValueForMetric(reading, key)]));
                    return {
                        label: deviceId,
                        data: allTimes.map(timestamp => valueMap.get(timestamp.getTime()) ?? null),
                        borderColor: deviceColors[deviceId],
                        backgroundColor: deviceColors[deviceId] + '22',
                        borderWidth: 2,
                        tension: 0.2,
                        pointRadius: SHOW_INFODOTS ? 3 : 0,
                        pointHoverRadius: SHOW_INFODOTS ? 5 : 0,
                        fill: false
                    };
                });

                new Chart(document.getElementById(`main-${key}`), {
                    type: 'line',
                    data: {
                        labels: allTimes.map(timestamp => formatDayLabel(timestamp)),
                        datasets
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { display: true, position: 'bottom' }
                        },
                        scales: {
                            y: { beginAtZero: false }
                        }
                    }
                });
            });
        }

        function buildSecondaryGraphs(data) {
            const container = document.getElementById('secondary-graphs');
            const availableDays = [...new Set(
                deviceOrder.flatMap(deviceId => (data[deviceId] || []).map(reading => formatDateKey(reading.timestamp)))
            )].sort();

            availableDays.forEach((day) => {
                secondaryMetricKeys.forEach((metricKey, metricIndex) => {
                    const dayReadings = deviceOrder.map(deviceId => {
                        const readingsForDay = (data[deviceId] || []).filter(reading => formatDateKey(reading.timestamp) === day);
                        return {
                            deviceId,
                            readings: readingsForDay.sort((a, b) => a.timestamp - b.timestamp)
                        };
                    }).filter(entry => entry.readings.length > 0);

                    if (dayReadings.length === 0) return;

                    const allTimes = [...new Set(
                        dayReadings.flatMap(entry => entry.readings.map(reading => getTimeBucket(reading.timestamp).getTime()))
                    )].sort((a, b) => a - b).map(ts => new Date(ts));

                    const datasets = dayReadings.map(entry => ({
                        label: entry.deviceId,
                        data: allTimes.map(time => {
                            const reading = entry.readings.find(r => getTimeBucket(r.timestamp).getTime() === time.getTime());
                            return reading ? getValueForMetric(reading, metricKey) : null;
                        }),
                        borderColor: deviceColors[entry.deviceId],
                        backgroundColor: deviceColors[entry.deviceId] + '22',
                        borderWidth: 1.8,
                        tension: 0.2,
                        pointRadius: SHOW_INFODOTS ? 1.8 : 0,
                        pointHoverRadius: SHOW_INFODOTS ? 3 : 0,
                        fill: false
                    }));

                    const card = document.createElement('div');
                    card.className = 'main-graph-card secondary-graph-card';
                    if (metricIndex === 2) {
                        card.classList.add('centered');
                    }

                    const metricDisplayName = getMetricDisplayName(metricKey);
                    card.innerHTML = `<h3>${formatDateToDayLabel(day)} — ${metricDisplayName}</h3><canvas id="secondary-${day}-${metricKey}"></canvas>`;
                    container.appendChild(card);

                    new Chart(document.getElementById(`secondary-${day}-${metricKey}`), {
                        type: 'line',
                        data: {
                            labels: allTimes.map(time => formatTimeLabel(time)),
                            datasets
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            layout: {
                                padding: {
                                    bottom: 10
                                }
                            },
                            plugins: { legend: { display: true, position: 'bottom' } },
                            scales: {
                                y: {
                                    beginAtZero: false,
                                    title: { display: true, text: metricDisplayName }
                                }
                            }
                        }
                    });
                });
            });
        }

        function buildTertiaryGraphs(data) {
            const container = document.getElementById('tertiary-graphs');
            const grid = document.createElement('div');
            grid.className = 'grid-container';
            container.appendChild(grid);

            const availableDays = [...new Set(
                deviceOrder.flatMap(deviceId => (data[deviceId] || []).map(reading => formatDateKey(reading.timestamp)))
            )].sort();

            deviceOrder.forEach(deviceId => {
                units.forEach(({ key, label }) => {
                    const readings = (data[deviceId] || []).filter(reading => availableDays.includes(formatDateKey(reading.timestamp)))
                        .sort((a, b) => a.timestamp - b.timestamp);

                    const card = document.createElement('div');
                    card.className = 'grid-card';
                    card.innerHTML = `<h4>${deviceId} — ${label}</h4><canvas id="tertiary-${deviceId}-${key}"></canvas>`;
                    grid.appendChild(card);

                    if (readings.length === 0) return;

                    const labels = readings.map(reading => formatDayLabel(reading.timestamp));
                    const values = readings.map(reading => getValueForMetric(reading, key));

                    new Chart(document.getElementById(`tertiary-${deviceId}-${key}`), {
                        type: 'line',
                        data: {
                            labels,
                            datasets: [{
                                label: deviceId,
                                data: values,
                                borderColor: deviceColors[deviceId],
                                backgroundColor: deviceColors[deviceId] + '22',
                                borderWidth: 2,
                                tension: 0.2,
                                pointRadius: SHOW_INFODOTS ? 3 : 0,
                                pointHoverRadius: SHOW_INFODOTS ? 5 : 0,
                                fill: false
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: { legend: { display: false } },
                            scales: { y: { beginAtZero: false } }
                        }
                    });
                });
            });
        }

        document.getElementById('seed-btn').addEventListener('click', toggleSimulation);
        document.getElementById('delete-btn').addEventListener('click', deleteAllReadings);
        document.getElementById('refresh-btn').addEventListener('click', buildDashboard);

        // Start the engine
        buildDashboard();
    </script>
</body>
</html>
